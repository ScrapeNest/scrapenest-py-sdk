name: Release

# Publishes to PyPI when a v* tag is pushed. Uses PyPI Trusted Publishing
# (OIDC) - no API token is stored in repository secrets. Before the first
# release, configure the trusted publisher for the `scrapenest-sdk` project at
# PyPI -> project -> Publishing (workflow: release.yml, environment: pypi).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
      - name: Check metadata
        run: twine check dist/*
      - name: Verify tag matches package version
        run: |
          python - <<'PY'
          import os, pathlib, re
          ns: dict = {}
          exec(pathlib.Path("src/scrapenest/_version.py").read_text(), ns)
          version = ns["__version__"]
          tag = os.environ["GITHUB_REF_NAME"]
          expected = f"v{version}"
          if tag != expected:
              raise SystemExit(f"tag {tag!r} does not match package version {expected!r}")
          print(f"tag {tag} matches package version {version}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
