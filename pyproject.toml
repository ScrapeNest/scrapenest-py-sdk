[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scrapenest-sdk"
dynamic = ["version"]
description = "Official Python SDK for the ScrapeNest scraping API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ScrapeNest" }]
keywords = ["scraping", "web-scraping", "crawler", "api", "sdk", "scrapenest"]
dependencies = [
  "httpx>=0.27",
  "typing_extensions>=4.6; python_version < '3.11'",
]
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP",
  "Typing :: Typed",
]

[project.urls]
Documentation = "https://docs.scrapenest.com"
Homepage = "https://scrapenest.com"
Source = "https://github.com/scrapenest/scrapenest-py-sdk"
Changelog = "https://github.com/scrapenest/scrapenest-py-sdk/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.hatch.version]
path = "src/scrapenest/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/scrapenest"]

[tool.hatch.build.targets.sdist]
include = [
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/pyproject.toml",
  "/src",
  "/tests",
  "/examples",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.per-file-ignores]
# Examples favor readable inline hook dictionaries over wrapped lines.
"examples/*" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
